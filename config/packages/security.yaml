# config/packages/security.yaml
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Public API routes — no auth needed
        api_public:
            pattern: ^/api/(login|register|auth/google|services|products|tours|rooms|foods|packages)
            security: false

        # JWT-protected API routes
        api_platform:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

        # Web (session-based) firewall
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\GoogleAuthenticator
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: /dashboard
                always_use_default_target_path: true
                username_parameter: username
                password_parameter: password
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login
                invalidate_session: true
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800  # 7 days
                path: /

    access_control:
        # Public API
        - { path: ^/api/login,        roles: PUBLIC_ACCESS }
        - { path: ^/api/register,     roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/google,  roles: PUBLIC_ACCESS }
        - { path: ^/api/services,     roles: PUBLIC_ACCESS }
        - { path: ^/api/products,     roles: PUBLIC_ACCESS }
        - { path: ^/api/tours,        roles: PUBLIC_ACCESS }
        - { path: ^/api/rooms,        roles: PUBLIC_ACCESS }
        - { path: ^/api/foods,        roles: PUBLIC_ACCESS }
        - { path: ^/api/packages,     roles: PUBLIC_ACCESS }

        # Protected API
        - { path: ^/api,              roles: IS_AUTHENTICATED_FULLY }

        # Public Web
        - { path: ^/login,                 roles: PUBLIC_ACCESS }
        - { path: ^/register,              roles: PUBLIC_ACCESS }
        - { path: ^/verify-email,          roles: PUBLIC_ACCESS }
        - { path: ^/connect/google,       roles: PUBLIC_ACCESS }
        - { path: ^/connect/google/check,  roles: PUBLIC_ACCESS }
        - { path: ^/landing,               roles: PUBLIC_ACCESS }
        - { path: ^/use-app,               roles: PUBLIC_ACCESS }

        # Protected Web
        - { path: ^/admin,            roles: ROLE_ADMIN }
        - { path: ^/staff,            roles: ROLE_STAFF }
        - { path: ^/my-reservations,  roles: ROLE_USER }